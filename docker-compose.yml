services:
  football-score-table:
    image: football-score-table:1.0.0
    # Only used if the image above isn't already present locally
    # (i.e. you have the source and want to build it yourself).
    build: .
    container_name: football-score-table
    restart: unless-stopped
    init: true                 # reap Chromium child processes
    shm_size: "1gb"            # Chromium crashes on the default 64MB /dev/shm
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      # Sofascore blocks many datacenter/office IPs. If the match list comes up
      # empty, point this at a residential/mobile proxy and restart:
      # SOFA_PROXY: "http://user:pass@host:port"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
